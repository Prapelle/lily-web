<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LILY — งานของฉัน</title>
<meta name="theme-color" content="#d9627d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LILY">
<style>
  :root { --bg:#faf7f5; --card:#fff; --ink:#2b2523; --mute:#8a7f7a; --line:#eadfda; --accent:#d9627d; --ok:#3f9d6b; --warn:#c9482b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1a19; --card:#272322; --ink:#f1ebe8; --mute:#a39893; --line:#3a3432; --accent:#ee8aa1; --ok:#62c28f; --warn:#f08466; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Noto Sans Thai",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  h1 { font-size:20px; margin:0; }
  .who { font-size:12px; color:var(--mute); }
  button { font:inherit; color:inherit; cursor:pointer; }
  .link { background:none; border:0; color:var(--accent); padding:4px 0; font-size:13px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { flex:1; padding:8px; border:1px solid var(--line); background:var(--card); border-radius:10px; font-size:14px; }
  .tab[aria-selected="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  li { display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  li.busy { opacity:.5; pointer-events:none; }
  .chk { flex:none; width:28px; height:28px; border-radius:50%; border:2px solid var(--accent); background:none; color:#fff; display:grid; place-items:center; font-size:16px; line-height:1; }
  .done .chk { background:var(--ok); border-color:var(--ok); }
  .body { flex:1; min-width:0; }
  .title { overflow-wrap:anywhere; }
  .done .title { text-decoration:line-through; color:var(--mute); }
  .meta { font-size:13px; color:var(--mute); }
  .meta .late { color:var(--warn); font-weight:600; }
  .meta .today { color:var(--accent); font-weight:600; }
  .id { font-size:12px; color:var(--mute); flex:none; }
  .empty, .msg { text-align:center; color:var(--mute); padding:32px 8px; }
  .err { color:var(--warn); }
  #gbtn { display:flex; justify-content:center; margin:24px 0; }
  .sr { position:absolute; left:-9999px; }
  .edit { flex:none; background:none; border:0; color:var(--mute); font-size:13px; padding:4px 6px; }
  .rep { color:var(--accent); }
  .fab { position:fixed; right:16px; bottom:16px; width:56px; height:56px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:30px; line-height:1; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .foot { text-align:center; margin:24px 0 80px; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); padding:16px; width:min(92vw,420px); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  label { display:block; font-size:13px; color:var(--mute); margin:10px 0 4px; }
  input, select { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .btn { padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .crow { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .crow .nm { flex:1; min-width:0; overflow-wrap:anywhere; }
  .crow small { color:var(--mute); display:block; }
  .chips { display:grid; gap:2px; max-height:140px; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:6px 10px; }
  .chips label { display:flex; gap:8px; align-items:center; margin:0; color:var(--ink); font-size:15px; }
  .chips input { width:auto; }
  .chip { color:var(--accent); }
  .nbody { white-space:pre-wrap; overflow-wrap:anywhere; }
  h2 { font-size:15px; margin:16px 0 4px; }
  .form-err { color:var(--warn); font-size:13px; min-height:18px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>LILY · งานของฉัน</h1><div class="who" id="who"></div></div>
    <div><button class="link" id="people" hidden>รายชื่อ</button> <button class="link" id="reload" hidden>รีเฟรช</button> <button class="link" id="out" hidden>ออกจากระบบ</button></div>
  </header>

  <div id="login" hidden>
    <p class="msg">เข้าสู่ระบบด้วยบัญชี Google ที่ได้รับอนุญาต</p>
    <div id="gbtn"></div>
  </div>

  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="open" aria-selected="true">ค้างอยู่ <span id="n-open"></span></button>
      <button class="tab" role="tab" data-tab="today" aria-selected="false">ถึงกำหนด <span id="n-today"></span></button>
      <button class="tab" role="tab" data-tab="done" aria-selected="false">เสร็จแล้ว</button>
      <button class="tab" role="tab" data-tab="notes" aria-selected="false">โน้ต</button>
    </div>
    <select id="pfilter" aria-label="กรองตามหมวด" hidden style="margin-bottom:10px"></select>
    <ul id="list"></ul>
    <div id="notes" hidden>
      <input id="nsearch" type="search" placeholder="ค้นโน้ต" maxlength="100" autocomplete="off" style="margin-bottom:10px">
      <ul id="nlist"></ul>
    </div>
    <div class="msg" id="note" role="status" aria-live="polite"></div>
  </div>
  <div class="msg" id="status" role="status" aria-live="polite">กำลังโหลด…</div>
  <div class="foot" id="foot" hidden><button class="link" id="export">ดาวน์โหลดไฟล์สำรองข้อมูล (JSON)</button></div>
</main>
<button class="fab" id="add" aria-label="เพิ่มงานใหม่" hidden>+</button>

<dialog id="cdlg">
  <strong>รายชื่อและกลุ่ม</strong>
  <div class="meta">ใน LINE พิมพ์ @ชื่อ หรือ @กลุ่ม ตอนนัดเพื่อเชิญทุกคนได้เลย</div>
  <h2>รายชื่อ</h2>
  <div id="c-list"></div>
  <form id="c-form" class="row" style="align-items:flex-end;margin-top:8px">
    <div><label for="c-name">ชื่อ (ไม่เว้นวรรค)</label><input id="c-name" maxlength="30" autocomplete="off" required></div>
    <div><label for="c-mail">อีเมล</label><input id="c-mail" type="email" maxlength="120" autocomplete="off" required></div>
    <button class="btn primary" type="submit">บันทึก</button>
  </form>
  <h2>กลุ่ม</h2>
  <div id="g-list"></div>
  <form id="g-form" style="margin-top:8px">
    <label for="g-name" id="g-label">สร้างกลุ่มใหม่ / แก้กลุ่ม</label>
    <input id="g-name" maxlength="30" placeholder="ชื่อกลุ่ม เช่น ทีมคอนเท้น" autocomplete="off" required>
    <label>สมาชิก</label>
    <div class="chips" id="g-chips"></div>
    <div class="actions"><button class="btn primary" type="submit">บันทึกกลุ่ม</button></div>
  </form>
  <div class="form-err" id="c-msg" role="status"></div>
  <div class="actions"><button type="button" class="btn" id="c-close">ปิด</button></div>
</dialog>

<dialog id="ndlg">
  <form id="nform" method="dialog">
    <strong id="n-title">โน้ตใหม่</strong>
    <label for="n-body">ข้อความ</label>
    <textarea id="n-body" rows="6" maxlength="2000" required style="width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px"></textarea>
    <label for="n-tag">หมวด (ไม่บังคับ ไม่เว้นวรรค)</label>
    <input id="n-tag" maxlength="30" list="plist" autocomplete="off">
    <div class="form-err" id="n-err" role="alert"></div>
    <div class="actions">
      <button type="button" class="btn" id="n-del" hidden>ลบ</button>
      <button type="button" class="btn" id="n-cancel">ยกเลิก</button>
      <button type="submit" class="btn primary" id="n-save">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog id="dlg">
  <form id="form" method="dialog">
    <strong id="dlg-title">งานใหม่</strong>
    <label for="f-title">ชื่องาน</label>
    <input id="f-title" maxlength="200" required autocomplete="off">
    <label for="f-project">หมวด/โปรเจกต์ (ไม่บังคับ)</label>
    <input id="f-project" maxlength="30" list="plist" placeholder="เช่น บ้านพร้อม" autocomplete="off">
    <datalist id="plist"></datalist>
    <div class="row">
      <div><label for="f-date">วันที่</label><input id="f-date" type="date"></div>
      <div><label for="f-time">เวลา (ไม่ใส่ = ทั้งวัน)</label><input id="f-time" type="time"></div>
    </div>
    <label for="f-repeat">ทำซ้ำ</label>
    <select id="f-repeat">
      <option value="">ไม่ซ้ำ</option>
      <option value="daily">ทุกวัน</option>
      <option value="weekdays">ทุกวันทำงาน (จ.–ศ.)</option>
      <option value="weekly">ทุกสัปดาห์</option>
      <option value="monthly">ทุกเดือน</option>
    </select>
    <div class="meta" id="f-note"></div>
    <div class="form-err" id="f-err" role="alert"></div>
    <div class="actions">
      <button type="button" class="btn" id="f-clear" hidden>ล้างกำหนด</button>
      <button type="button" class="btn" id="f-cancel">ยกเลิก</button>
      <button type="submit" class="btn primary" id="f-save">บันทึก</button>
    </div>
  </form>
</dialog>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ===== ตั้งค่า 2 ค่านี้ก่อนใช้งาน =====
const API_BASE = "https://lily.jsuparkit.workers.dev"; // URL ของ Worker (ไม่มี / ท้าย)
const GOOGLE_CLIENT_ID = "665164861966-to9abp8egheksdm0f8vtk64kp6emcv0r.apps.googleusercontent.com";
// ====================================

const $ = (id) => document.getElementById(id);
const TZ = "Asia/Bangkok";
const REPEAT_TH = { daily: "ทุกวัน", weekdays: "ทุกวันทำงาน", weekly: "ทุกสัปดาห์" };
const ERR_TH = {
  in_the_past: "เวลานั้นผ่านไปแล้ว เลือกวันเวลาใหม่",
  bad_title: "ชื่องานต้องไม่ว่างและไม่เกิน 200 ตัวอักษร",
  bad_date: "วันที่ไม่ถูกต้อง",
  bad_time: "เวลาไม่ถูกต้อง",
  time_without_date: "ใส่เวลาแล้วต้องเลือกวันที่ด้วย",
  repeat_needs_date: "งานที่ทำซ้ำต้องเลือกวันที่เริ่ม",
  bad_repeat: "รูปแบบการทำซ้ำไม่ถูกต้อง",
  bad_project: "ชื่อหมวดไม่เว้นวรรค ไม่เกิน 30 ตัว และห้ามเป็นตัวเลขล้วน",
  bad_note_too_long: "โน้ตยาวเกิน 2,000 ตัวอักษร",
  bad_note_empty: "โน้ตต้องไม่ว่าง",
  bad_note_full: "โน้ตเต็มแล้ว ลบบางอันก่อน",
  not_found_or_not_open: "งานนี้ถูกเปลี่ยนสถานะไปแล้ว",
};
let idToken = null, data = null, tab = "open", editing = null, pfilter = "", notes = [], editingNote = null;

const ymdBkk = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d); // YYYY-MM-DD
const fmtDay = (d) => new Intl.DateTimeFormat("th-TH", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" }).format(d);
const hhmmBkk = (d) => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));
  return p.hour + ":" + p.minute;
};

function repeatText(rule) {
  if (!rule) return "";
  if (rule.startsWith("monthly:")) return "ทุกเดือน (วันที่ " + rule.slice(8) + ")";
  return REPEAT_TH[rule] || "";
}

function dueInfo(t, status) {
  if (!t.due_at) return { text: "ไม่มีกำหนด", cls: "" };
  const d = new Date(t.due_at), now = new Date(data ? data.now : Date.now());
  const text = fmtDay(d) + (t.timed ? " " + hhmmBkk(d) : "");
  const dayD = ymdBkk(d), dayN = ymdBkk(now);
  if (status === "done") return { text, cls: "" };
  if (dayD < dayN || (dayD === dayN && t.timed && d < now)) return { text: "เลยกำหนด · " + text, cls: "late" };
  if (dayD === dayN) return { text: "วันนี้" + (t.timed ? " " + hhmmBkk(d) : ""), cls: "today" };
  return { text, cls: "" };
}

const isToday = (t) => t.due_at && ymdBkk(new Date(t.due_at)) <= ymdBkk(new Date(data.now));

function render() {
  const open = data.open, today = open.filter(isToday);
  $("n-open").textContent = "(" + open.length + ")";
  $("n-today").textContent = "(" + today.length + ")";
  const projects = [...new Set([...open, ...data.done].map((t) => t.project).filter(Boolean))].sort();
  $("plist").replaceChildren(...projects.map((p) => { const o = document.createElement("option"); o.value = p; return o; }));
  const pf = $("pfilter");
  if (pfilter && !projects.includes(pfilter)) pfilter = "";
  pf.replaceChildren(...[["", "ทุกหมวด"], ...projects.map((p) => [p, "#" + p])].map(([v, l]) => { const o = document.createElement("option"); o.value = v; o.textContent = l; return o; }));
  pf.value = pfilter;
  const isNotes = tab === "notes";
  pf.hidden = isNotes || !projects.length;
  $("list").hidden = isNotes; $("notes").hidden = !isNotes;
  if (isNotes) { loadNotes(); $("note").textContent = ""; return; }
  const base = tab === "open" ? open : tab === "today" ? today : data.done;
  const rows = pfilter ? base.filter((t) => t.project === pfilter) : base;
  const ul = $("list");
  ul.replaceChildren();
  for (const t of rows) {
    const li = document.createElement("li");
    if (tab === "done") li.className = "done";
    const b = document.createElement("button");
    b.className = "chk";
    b.textContent = tab === "done" ? "✓" : "";
    b.setAttribute("aria-label", (tab === "done" ? "ยกเลิกเสร็จ: " : "ทำเสร็จ: ") + t.title);
    b.addEventListener("click", () => act(t.id, tab === "done" ? "reopen" : "done", li));
    const body = document.createElement("div");
    body.className = "body";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = t.title; // textContent เท่านั้น ไม่ใช้ innerHTML
    const meta = document.createElement("div");
    meta.className = "meta";
    const di = dueInfo(t, tab === "done" ? "done" : "open");
    const span = document.createElement("span");
    span.className = di.cls;
    span.textContent = di.text;
    meta.append(span);
    if (t.repeat) { const r = document.createElement("span"); r.className = "rep"; r.textContent = " · 🔁 " + repeatText(t.repeat); meta.append(r); }
    if (t.project) { const pj = document.createElement("span"); pj.className = "chip"; pj.textContent = " · #" + t.project; meta.append(pj); }
    body.append(title, meta);
    li.append(b, body);
    if (tab !== "done") {
      const e = document.createElement("button");
      e.className = "edit";
      e.textContent = "แก้ไข";
      e.setAttribute("aria-label", "แก้ไข: " + t.title);
      e.addEventListener("click", () => openForm(t));
      li.append(e);
    }
    const id = document.createElement("div");
    id.className = "id";
    id.textContent = "#" + t.id;
    li.append(id);
    ul.append(li);
  }
  $("note").textContent = rows.length ? "" : (tab === "done" ? "ยังไม่มีงานที่เสร็จ" : "ไม่มีงานค้าง 🎉");
}

function show(which) {
  $("login").hidden = which !== "login";
  $("app").hidden = which !== "app";
  $("out").hidden = $("reload").hidden = $("people").hidden = $("foot").hidden = $("add").hidden = which !== "app";
  $("status").hidden = which !== "status";
}
function setStatus(msg, isErr) {
  show("status");
  $("status").textContent = msg;
  $("status").className = "msg" + (isErr ? " err" : "");
}

async function api(path, method = "GET", body) {
  const headers = { Authorization: "Bearer " + idToken };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(API_BASE + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let out = null;
  try { out = await res.json(); } catch {}
  if (!res.ok) { const e = new Error((out && out.error) || "http_" + res.status); e.status = res.status; e.missing = out && out.missing; throw e; }
  return out;
}

function authFailed(e) {
  if (e.status === 401) { signOut("เซสชันหมดอายุ กำลังเข้าสู่ระบบอีกครั้ง…", true); return true; }
  if (e.status === 403) { signOut("บัญชีนี้ไม่ได้รับอนุญาต"); return true; }
  return false;
}

async function load(msg) {
  try {
    data = await api("/api/tasks");
    $("who").textContent = data.email;
    show("app");
    render();
    if (msg) $("note").textContent = msg;
  } catch (e) {
    if (authFailed(e)) return;
    if (e.message === "not_configured") setStatus("ฝั่งเซิร์ฟเวอร์ยังตั้งค่าไม่ครบ — ขาด: " + ((e.missing && e.missing.join(", ")) || "GOOGLE_CLIENT_ID / ALLOWED_EMAILS / LINE_USER_ID"), true);
    else setStatus("โหลดไม่สำเร็จ ลองรีเฟรชอีกครั้ง", true);
  }
}

async function act(id, what, li) {
  li.classList.add("busy");
  try {
    const r = await api("/api/tasks/" + id + "/" + what, "POST");
    await load(r && r.next ? "สร้างรอบถัดไปแล้ว 🔁 (#" + r.next.id + ")" : "");
  } catch (e) {
    li.classList.remove("busy");
    if (authFailed(e)) return;
    $("note").textContent = e.status === 404 ? "งานนี้เปลี่ยนสถานะไปแล้ว กำลังรีเฟรช…" : "ทำรายการไม่สำเร็จ";
    if (e.status === 404) load();
  }
}

// ----- ฟอร์มเพิ่ม/แก้ไข -----
function openForm(t) {
  editing = t || null;
  $("dlg-title").textContent = t ? "แก้ไขงาน #" + t.id : "งานใหม่";
  $("f-title").value = t ? t.title : "";
  $("f-project").value = t && t.project ? t.project : "";
  let d = "", tm = "";
  if (t && t.due_at) { const dt = new Date(t.due_at); d = ymdBkk(dt); tm = t.timed ? hhmmBkk(dt) : ""; }
  $("f-date").value = d; $("f-time").value = tm;
  $("dlg").dataset.d = d; $("dlg").dataset.t = tm;
  $("f-repeat").value = "";
  $("f-repeat").disabled = !!t;
  $("f-note").textContent = t ? (t.repeat ? "ทำซ้ำ: " + repeatText(t.repeat) + " (เปลี่ยนรูปแบบซ้ำใน LINE หรือสร้างงานใหม่)" : "") : "";
  $("f-clear").hidden = !t;
  $("f-err").textContent = "";
  $("f-save").disabled = false;
  $("dlg").showModal();
  $("f-title").focus();
}

$("add").addEventListener("click", () => (tab === "notes" ? openNote(null) : openForm(null)));
$("f-cancel").addEventListener("click", () => $("dlg").close());
$("f-clear").addEventListener("click", () => { $("f-date").value = ""; $("f-time").value = ""; });
$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("f-err").textContent = "";
  const title = $("f-title").value.trim();
  const date = $("f-date").value, time = $("f-time").value;
  if (!title) { $("f-err").textContent = ERR_TH.bad_title; return; }
  $("f-save").disabled = true;
  try {
    let msg = "";
    if (!editing) {
      const body = { title, due_date: date || null, due_time: time || null };
      if ($("f-project").value.trim()) body.project = $("f-project").value.trim().replace(/^#/, "");
      if ($("f-repeat").value) body.repeat = $("f-repeat").value;
      const r = await api("/api/tasks", "POST", body);
      msg = body.repeat && r && r.repeat_saved === false ? "เพิ่มงานแล้ว แต่ตั้งซ้ำไม่สำเร็จ (ยังไม่ได้สร้างตารางงานซ้ำ)" : "เพิ่มงานแล้ว ✅";
    } else {
      const body = {};
      if (title !== editing.title) body.title = title;
      const pj = $("f-project").value.trim().replace(/^#/, "");
      if (pj !== (editing.project || "")) body.project = pj || null;
      if (date !== $("dlg").dataset.d || time !== $("dlg").dataset.t) { body.due_date = date || null; body.due_time = time || null; }
      if (Object.keys(body).length) await api("/api/tasks/" + editing.id + "/update", "POST", body);
      msg = Object.keys(body).length ? "บันทึกแล้ว ✅" : "";
    }
    $("dlg").close();
    await load(msg);
  } catch (e) {
    $("f-save").disabled = false;
    if (e.status === 401 || e.status === 403) { $("dlg").close(); authFailed(e); return; }
    $("f-err").textContent = ERR_TH[e.message] || "บันทึกไม่สำเร็จ ลองอีกครั้ง";
  }
});

// ----- ไฟล์สำรอง -----
$("export").addEventListener("click", async () => {
  try {
    const out = await api("/api/export");
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "lily-backup-" + ymdBkk(new Date()) + ".json";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    if (!authFailed(e)) $("note").textContent = "ดาวน์โหลดไม่สำเร็จ";
  }
});

// ----- กรองหมวด / โน้ต -----
$("pfilter").addEventListener("change", () => { pfilter = $("pfilter").value; render(); });
let nTimer = null;
$("nsearch").addEventListener("input", () => { clearTimeout(nTimer); nTimer = setTimeout(loadNotes, 300); });
async function loadNotes() {
  try {
    const q = $("nsearch").value.trim();
    const r = await api("/api/notes" + (q ? "?q=" + encodeURIComponent(q) : ""));
    notes = r.notes || [];
    renderNotes();
  } catch (e) {
    if (authFailed(e)) return;
    $("note").textContent = e.message === "no_tables" ? "ยังไม่ได้สร้างตาราง notes ใน D1 (ดู README)" : "โหลดโน้ตไม่สำเร็จ";
  }
}
function renderNotes() {
  const ul = $("nlist"); ul.replaceChildren();
  for (const n of notes) {
    const li = document.createElement("li");
    const body = document.createElement("div"); body.className = "body";
    const txt = document.createElement("div"); txt.className = "title nbody"; txt.textContent = n.body;
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = fmtDay(new Date(n.created_at)) + " " + hhmmBkk(new Date(n.created_at));
    if (n.tag) { const c = document.createElement("span"); c.className = "chip"; c.textContent = " · #" + n.tag; meta.append(c); }
    body.append(txt, meta);
    const e = document.createElement("button"); e.className = "edit"; e.textContent = "แก้ไข"; e.addEventListener("click", () => openNote(n));
    const id = document.createElement("div"); id.className = "id"; id.textContent = "#" + n.id;
    li.append(body, e, id); ul.append(li);
  }
  $("note").textContent = notes.length ? "" : ($("nsearch").value ? "ไม่พบโน้ตที่ตรงกับคำค้น" : "ยังไม่มีโน้ต กด + เพื่อจด หรือพิมพ์ “จด …” ใน LINE");
}
function openNote(n) {
  editingNote = n || null;
  $("n-title").textContent = n ? "แก้โน้ต #" + n.id : "โน้ตใหม่";
  $("n-body").value = n ? n.body : ""; $("n-tag").value = n && n.tag ? n.tag : "";
  $("n-del").hidden = !n; $("n-err").textContent = ""; $("n-save").disabled = false;
  $("ndlg").showModal(); $("n-body").focus();
}
$("n-cancel").addEventListener("click", () => $("ndlg").close());
$("n-del").addEventListener("click", async () => {
  if (!editingNote || !window.confirm("ลบโน้ตนี้?")) return;
  try { await api("/api/notes/" + editingNote.id + "/delete", "POST", {}); $("ndlg").close(); await loadNotes(); }
  catch (e) { if (!authFailed(e)) $("n-err").textContent = "ลบไม่สำเร็จ"; }
});
$("nform").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const body = { body: $("n-body").value.trim(), tag: $("n-tag").value.trim().replace(/^#/, "") || null };
  if (!body.body) { $("n-err").textContent = ERR_TH.bad_note_empty; return; }
  $("n-save").disabled = true;
  try {
    await api(editingNote ? "/api/notes/" + editingNote.id + "/update" : "/api/notes", "POST", body);
    $("ndlg").close(); await loadNotes();
  } catch (e) {
    $("n-save").disabled = false;
    if (e.status === 401 || e.status === 403) { $("ndlg").close(); authFailed(e); return; }
    $("n-err").textContent = ERR_TH[e.message] || (e.message === "no_tables" ? "ยังไม่ได้สร้างตาราง notes ใน D1" : "บันทึกไม่สำเร็จ");
  }
});

// ----- รายชื่อและกลุ่ม -----
let book = { contacts: [], groups: [] };
function cmsg(t, bad) { const m = $("c-msg"); m.textContent = t || ""; m.style.color = bad ? "" : "var(--ok)"; }
function crow(main, sub, buttons) {
  const d = document.createElement("div"); d.className = "crow";
  const n = document.createElement("div"); n.className = "nm"; n.textContent = main;
  const sm = document.createElement("small"); sm.textContent = sub; n.appendChild(sm);
  d.appendChild(n);
  for (const [label, fn] of buttons) { const b = document.createElement("button"); b.type = "button"; b.className = "link"; b.textContent = label; b.onclick = fn; d.appendChild(b); }
  return d;
}
function renderBook(editGroup) {
  const cl = $("c-list"); cl.replaceChildren();
  if (!book.contacts.length) cl.textContent = "ยังไม่มีรายชื่อ";
  for (const c of book.contacts) cl.appendChild(crow("@" + c.name, c.email, [["ลบ", () => bookCall("/api/contacts/delete", { name: c.name }, "ลบ @" + c.name + " ? (จะถูกเอาออกจากทุกกลุ่ม)")]]));
  const gl = $("g-list"); gl.replaceChildren();
  if (!book.groups.length) gl.textContent = "ยังไม่มีกลุ่ม";
  for (const g of book.groups) gl.appendChild(crow("@" + g.name, g.members.join(", ") || "(ว่าง)", [
    ["แก้", () => { renderBook(g); $("g-name").focus(); }],
    ["ลบ", () => bookCall("/api/groups/delete", { name: g.name }, "ลบกลุ่ม @" + g.name + " ? (รายชื่อคนยังอยู่)")],
  ]));
  const ch = $("g-chips"); ch.replaceChildren();
  if (!book.contacts.length) ch.textContent = "เพิ่มรายชื่อก่อน";
  const sel = new Set(editGroup ? editGroup.members : []);
  for (const c of book.contacts) {
    const l = document.createElement("label"), i = document.createElement("input");
    i.type = "checkbox"; i.value = c.name; i.checked = sel.has(c.name);
    l.append(i, document.createTextNode(c.name)); ch.appendChild(l);
  }
  if (editGroup) { $("g-name").value = editGroup.name; $("g-name").readOnly = true; }
  else { $("g-name").readOnly = false; }
}
async function loadBook(keepMsg) {
  try { book = await api("/api/contacts"); renderBook(); if (!keepMsg) cmsg(""); }
  catch (e) { if (!authFailed(e)) cmsg(e.message === "no_tables" ? "ยังไม่ได้สร้างตารางรายชื่อใน D1 (ดู README)" : "โหลดรายชื่อไม่สำเร็จ", true); }
}
async function bookCall(path, body, confirmText) {
  if (confirmText && !window.confirm(confirmText)) return;
  try {
    const r = await api(path, "POST", body);
    cmsg(r.message, !r.ok);
    if (r.ok) { $("g-name").value = ""; await loadBook(true); }
  } catch (e) { if (!authFailed(e)) cmsg(e.message === "no_tables" ? "ยังไม่ได้สร้างตารางรายชื่อใน D1 (ดู README)" : "ทำรายการไม่สำเร็จ", true); }
}
$("people").onclick = () => { $("cdlg").showModal(); $("g-name").value = ""; loadBook(); };
$("c-close").onclick = () => $("cdlg").close();
$("c-form").onsubmit = async (ev) => {
  ev.preventDefault();
  await bookCall("/api/contacts", { name: $("c-name").value.trim().replace(/^@/, ""), email: $("c-mail").value.trim() });
  if (/^(บันทึกแล้ว|อัปเดตแล้ว)/.test($("c-msg").textContent)) { $("c-name").value = ""; $("c-mail").value = ""; }
};
$("g-form").onsubmit = (ev) => {
  ev.preventDefault();
  const members = [...$("g-chips").querySelectorAll("input:checked")].map((i) => i.value);
  if (!members.length) { cmsg("เลือกสมาชิกอย่างน้อย 1 คน", true); return; }
  bookCall("/api/groups", { name: $("g-name").value.trim().replace(/^@/, ""), members });
};

// ----- เข้าสู่ระบบ -----
function signOut(msg, retry) {
  idToken = null; data = null;
  try { sessionStorage.removeItem("lily_tok"); } catch {}
  if (window.google && google.accounts && google.accounts.id) {
    if (!retry) google.accounts.id.disableAutoSelect();
    else google.accounts.id.prompt(); // เซสชันหมดอายุ: ให้ Google ล็อกอินกลับให้เงียบ ๆ ถ้าเคยอนุญาตไว้
  }
  show("login");
  $("who").textContent = msg || "";
}

function onCredential(resp) {
  idToken = resp.credential;
  try { sessionStorage.setItem("lily_tok", idToken); } catch {}
  setStatus("กำลังโหลด…");
  load();
}

function tokenUsable(tok) {
  try {
    const p = JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return p.exp * 1000 > Date.now() + 30000;
  } catch { return false; }
}

function initGoogle() {
  if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(initGoogle, 100); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false });
  google.accounts.id.renderButton($("gbtn"), { theme: "outline", size: "large", text: "signin_with", locale: "th" });
  if (!idToken) { show("login"); google.accounts.id.prompt(); }
}

// กลับมาเปิดหน้าหลังพักนาน (token หมดอายุประมาณ 1 ชม.): โหลดใหม่/ล็อกอินกลับอัตโนมัติ
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || $("app").hidden) return;
  if (idToken && !tokenUsable(idToken)) signOut("กำลังเข้าสู่ระบบอีกครั้ง…", true);
  else if (idToken) load();
});

document.querySelectorAll(".tab").forEach((b) =>
  b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    if (data) render();
  })
);
$("reload").addEventListener("click", () => load());
$("out").addEventListener("click", () => signOut(""));

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

try {
  const saved = sessionStorage.getItem("lily_tok");
  if (saved && tokenUsable(saved)) { idToken = saved; load(); }
} catch {}
initGoogle();
</script>
